# =============================================================================
# Armenian Kingdoms Tier List — all content for /opinions/armenian-kingdoms-tier-list/
#
# HOW TO EDIT
#   * Armenian is the original language: fill in every `..._hy` field.
#   * `..._en` fields are the AI-assisted English translation of the Armenian.
#   * Empty text ("") shows a "coming soon" placeholder on the page.
#   * stats order: [Diplomacy, Martial, Stewardship, Intrigue, Learning], CK3 scale 0–20.
#   * Tier is computed from the total of the five stats:
#       S ≥ 78 · A ≥ 70 · B ≥ 62 · C ≥ 54 · D ≥ 46 · F below
#     Set `tier:` (S/A/B/C/D/F) on a kingdom to override it.
#   * flag: path to an image; leave "" to show a coloured medallion with `mono`.
# =============================================================================

