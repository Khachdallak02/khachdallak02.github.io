# Intro blocks shown above the tier list (question + answer).
intro:
  - q_hy: ""
    a_hy: ""
    q_en: "Why kingdoms and not kings?"
    a_en: ""
  - q_hy: ""
    a_hy: ""
    q_en: "Why exactly Crusader Kings III attributes?"
    a_en: "In CK3 every ruler is defined by five attributes — the main directions a leader can be strong in. The same five work for a whole kingdom, and make it easier to compare a kingdom that was strong in battle with one that was better at building and culture."

# The five attributes. desc_* explains how the attribute is judged for a kingdom.
skills:
  - key: dip
    name_hy: "Դիվանագիտություն"
    name_en: "Diplomacy"
    desc_hy: ""
    desc_en: "Alliances, negotiation, and how well the kingdom balanced the great powers around it."
  - key: mar
    name_hy: "Ռազմարվեստ"
    name_en: "Martial"
    desc_hy: ""
    desc_en: "How often the kingdom won its wars, especially when outnumbered, and how much territory it could take and hold."
  - key: ste
    name_hy: "Կառավարում"
    name_en: "Stewardship"
    desc_hy: ""
    desc_en: "Prosperity, trade, economic reforms and large construction projects."
  - key: int
    name_hy: "Խարդավանք"
    name_en: "Intrigue"
    desc_hy: ""
    desc_en: "Skill at plots, and at managing the dynamics between crown, nobility and church."
  - key: lea
    name_hy: "Ուսում"
    name_en: "Learning"
    desc_hy: ""
    desc_en: "Scholarly, cultural and religious progress during the kingdom's lifetime."

